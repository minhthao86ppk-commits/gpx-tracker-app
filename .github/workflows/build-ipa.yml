name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt thư viện
        run: npm install

      - name: 4. Tạo mã nguồn iOS Native
        run: npx expo prebuild --platform ios --clean

      - name: 5. Biên dịch với Xcode
        run: |
          cd ios
          pod install
          xcodebuild -workspace *.xcworkspace \
            -scheme March \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/march.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 6. Đóng gói thành file .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/march.xcarchive/Products/Applications/*.app Payload/
          zip -r march.ipa Payload

      - name: 7. Xuất file IPA để tải về
        uses: actions/upload-artifact@v4
        with:
          name: march-ipa
          path: ios/march.ipa
